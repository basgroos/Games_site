<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLE--></title>
<meta name="description" content="Bas Games: browsergames om direct te spelen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305040d'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23ffd23f' font-family='Arial Black'%3EB%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#0c0a1d; --panel:#17133a; --panel2:#211b4c; --line:#3b3478; --edge:#05040d;
  --text:#eeebff; --muted:#a39ecb; --pow:#ffd23f;
  --f-display:'Bungee', Impact, 'Arial Black', system-ui, sans-serif;
  --f-body:'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-num:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.5px);background-size:14px 14px}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{padding:56px 0 28px}
.logo{display:flex;align-items:center;gap:14px}
.logo-mark{width:58px;height:58px;border-radius:14px;background:var(--pow);color:var(--edge);display:grid;place-items:center;font-family:var(--f-display);font-size:34px;border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge);transform:rotate(-4deg)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,7vw,64px);line-height:1;margin:0;letter-spacing:.01em}
h1 span{color:var(--pow)}
.lead{color:var(--muted);font-size:18px;max-width:560px;margin:16px 0 0}
.kicker{font-family:var(--f-num);text-transform:uppercase;letter-spacing:.14em;font-weight:700;font-size:14px;color:var(--muted);margin:28px 0 12px}
.games{display:grid;gap:16px;padding-bottom:48px}
.game{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--panel);border:3px solid var(--edge);border-radius:10px;padding:16px;text-decoration:none;box-shadow:5px 5px 0 var(--edge);transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden}
.game::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
a.game:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--edge)}
a.game:focus-visible{outline:3px solid var(--pow);outline-offset:3px}
.game-art{width:120px;height:120px;border-radius:8px;border:3px solid var(--edge);background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--c) 70%,#fff) 0,var(--c) 45%,color-mix(in srgb,var(--c) 40%,#000) 100%);display:grid;place-items:center}
.game-art span{font-family:var(--f-display);font-size:56px;color:var(--edge);text-shadow:2px 2px 0 rgba(255,255,255,.35)}
.game-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.game-tag{font-family:var(--f-num);text-transform:uppercase;letter-spacing:.12em;font-weight:700;font-size:13px;color:var(--c)}
.game-name{font-family:var(--f-display);font-size:28px;line-height:1.1}
.game-desc{color:var(--muted);max-width:620px}
.game-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.game-meta span{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
.game-meta .ver{font-family:var(--f-num);color:var(--muted)}
.play{font-family:var(--f-num);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.06em;background:var(--pow);color:var(--edge);padding:12px 18px;border-radius:8px;border:3px solid var(--edge);white-space:nowrap}
.game.soon{opacity:.6;box-shadow:none;border-style:dashed;grid-template-columns:120px minmax(0,1fr)}
footer{border-top:2px solid var(--line);padding:18px 0 40px;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
.env-ribbon{position:fixed;left:10px;bottom:10px;z-index:90;background:#f59e0b;color:#1a1200;font:800 12px/1 var(--f-num);letter-spacing:.06em;padding:6px 10px;border-radius:5px;border:2px solid #1a1200}
@media (max-width:640px){
  header{padding-top:36px}
  .game{grid-template-columns:72px minmax(0,1fr);gap:14px}
  .game.soon{grid-template-columns:72px minmax(0,1fr)}
  .game-art{width:72px;height:72px}.game-art span{font-size:36px}
  .game-name{font-size:22px}
  .play{grid-column:1/-1;text-align:center}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><div class="logo-mark" aria-hidden="true">B</div><h1>Bas <span>Games</span></h1></div>
    <p class="lead">Spellen om meteen in je browser te spelen. Geen installatie, je voortgang wordt op dit apparaat bewaard.</p>
  </header>
  <main>
    <div class="kicker">Spellen</div>
    <div class="games"><!--GAMES-->
    </div>
  </main>
  <footer><span>© Bas Games</span><span><!--FOOT--></span></footer>
</div>
<!--ENV-->
</body>
</html>
