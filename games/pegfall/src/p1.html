<title>Pegfall Arena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: toy-box arcade. One centered play column on a felt-teal table; chunky press-down toy buttons; rarity is the only rainbow. Single deliberate dark look. */
:root{
  --bg:#0c2a2f; --bg2:#103840; --panel:#154650; --panel2:#1b5560; --line:rgba(255,255,255,.09);
  --text:#f2f7ee; --muted:#94bdb7; --sun:#ffd23f; --sun-d:#b98a00; --mint:#3fe0b0; --coral:#ff6a55; --grape:#a978ff;
  --c-common:#a9bccf; --c-uncommon:#5fd38a; --c-rare:#4fb3ff; --c-epic:#b47cff; --c-legendary:#ffc233; --c-mythic:#ff4f8b;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--text);min-height:100%}
body{font-family:var(--body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.6px);background-size:22px 22px;}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
#app{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.logo{font-family:var(--display);font-size:26px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.logo i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--sun) 13% 60%,var(--sun-d) 100%);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.logo b{color:var(--sun);font-weight:400}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.on .dot{background:var(--mint);box-shadow:0 0 8px var(--mint)}
.shard{width:14px;height:14px;transform:rotate(45deg);background:linear-gradient(135deg,#9ff3ff,#4fb3ff 50%,#a978ff);border-radius:3px;display:inline-block}
.num{font-variant-numeric:tabular-nums;font-weight:700}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
h2{font-size:30px} h3{font-size:20px}
.sub{color:var(--muted)}
.btn{--b:var(--sun);--bd:var(--sun-d);--fg:#2a1d00;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 20px;font-family:var(--display);font-size:18px;letter-spacing:.02em;cursor:pointer;background:var(--b);color:var(--fg);box-shadow:0 5px 0 var(--bd),0 8px 18px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s,filter .15s;user-select:none}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--bd),0 3px 8px rgba(0,0,0,.25)}
.btn:disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed;transform:none}
.btn.mint{--b:var(--mint);--bd:#14966f;--fg:#00261b}
.btn.coral{--b:var(--coral);--bd:#b23624;--fg:#2b0700}
.btn.grape{--b:var(--grape);--bd:#6a3cc0;--fg:#16002e}
.btn.ghost{--b:var(--panel2);--bd:#0b3036;--fg:var(--text)}
.btn.sm{font-size:15px;padding:8px 14px;border-radius:11px}
.btn:focus-visible,.tile:focus-visible,.ccard:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:3px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.hidden{display:none!important}

/* menu */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px;align-items:center;margin-bottom:22px}
.hero h1{font-size:clamp(42px,7vw,76px);line-height:.95;color:var(--sun);text-shadow:0 5px 0 #8a5f00,0 10px 30px rgba(0,0,0,.35)}
.hero h1 span{display:block;color:var(--text);text-shadow:0 5px 0 #0a2226}
.hero p{max-width:46ch;color:var(--muted);font-size:16px;margin:14px 0 0}
.hero canvas{width:100%;max-width:340px;justify-self:center;aspect-ratio:400/560;display:block;border-radius:22px;background:var(--bg2);border:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{position:relative;text-align:left;border:0;border-radius:20px;padding:18px;cursor:pointer;background:var(--panel);box-shadow:0 6px 0 #0a2a30;transition:transform .1s;min-height:116px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;overflow:hidden}
.tile:hover{transform:translateY(-2px)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 #0a2a30}
.tile b{font-family:var(--display);font-weight:400;font-size:24px}
.tile span{color:var(--muted);font-size:13.5px}
.tile.big{grid-column:span 2;background:var(--sun);color:#2a1d00;box-shadow:0 6px 0 var(--sun-d)}
.tile.big span{color:#5c4300}
.tile .glyph{position:absolute;right:14px;top:12px;font-family:var(--display);font-size:46px;opacity:.16}
.stats-line{margin-top:14px;color:var(--muted);font-size:13px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.ccard{--rc:var(--c-common);position:relative;border:2px solid color-mix(in srgb,var(--rc) 55%,transparent);border-radius:16px;padding:8px 8px 10px;background:linear-gradient(170deg,color-mix(in srgb,var(--rc) 26%,var(--panel)) ,var(--panel) 60%);cursor:pointer;text-align:center;transition:transform .12s,box-shadow .12s}
.ccard:hover{transform:translateY(-3px)}
.ccard.sel{box-shadow:0 0 0 3px var(--sun),0 0 22px color-mix(in srgb,var(--sun) 50%,transparent);transform:translateY(-3px)}
.ccard:disabled{opacity:.38;cursor:not-allowed;transform:none}
.ccard-art{aspect-ratio:1;border-radius:11px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--rc) 40%,transparent),transparent 70%);display:grid;place-items:center}
.ccard-art img{width:92%;image-rendering:auto}
.ccard.locked .ccard-art img{filter:brightness(0) opacity(.45)}
.ccard-name{font-family:var(--display);font-size:16px;margin-top:4px;line-height:1.1}
.ccard-meta{display:flex;justify-content:center;gap:6px;font-size:11px;margin-top:4px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ccard-meta .rar{color:var(--rc);font-weight:700}
.badge{position:absolute;top:6px;right:6px;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--sun);color:#2a1d00;letter-spacing:.04em}
.badge.l{left:6px;right:auto;background:var(--panel2);color:var(--text)}
.r-uncommon{--rc:var(--c-uncommon)} .r-rare{--rc:var(--c-rare)} .r-epic{--rc:var(--c-epic)} .r-legendary{--rc:var(--c-legendary)} .r-mythic{--rc:var(--c-mythic)}
.r-mythic{animation:myth 3s linear infinite}
@keyframes myth{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
.r-legendary:not(.locked),.r-mythic:not(.locked){box-shadow:0 0 18px color-mix(in srgb,var(--rc) 35%,transparent)}

/* screen header */
.shead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.shead h2{flex:1;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500}
.tab.on{background:var(--text);color:var(--bg)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(4,16,19,.78);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;max-width:720px;width:100%;position:relative}
.detail{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px}
.detail canvas{width:100%;max-width:240px;aspect-ratio:1;border-radius:16px;background:var(--bg2)}
.statbar{display:grid;grid-template-columns:82px minmax(0,1fr) 48px;gap:8px;align-items:center;font-size:13px}
.statbar .bar{height:9px;border-radius:9px;background:var(--bg2);overflow:hidden}
.statbar .bar i{display:block;height:100%;border-radius:9px;background:var(--rc,var(--sun))}
.ability{background:var(--bg2);border-radius:14px;padding:12px;margin-top:6px}
.ability b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--sun)}
.xclose{position:absolute;top:10px;right:10px}

/* gacha */
.gacha{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:18px}
.altar{position:relative;border-radius:22px;overflow:hidden;background:var(--bg2);border:1px solid var(--line)}
.altar canvas{display:block;width:100%;aspect-ratio:16/11}
.altar .acts{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:0 12px}
.rates{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.rates span:nth-child(odd){font-weight:700}
.pitybar{height:10px;background:var(--bg2);border-radius:10px;overflow:hidden;margin-top:6px}
.pitybar i{display:block;height:100%;background:linear-gradient(90deg,var(--c-epic),var(--c-legendary))}
.summon{position:fixed;inset:0;z-index:60;background:#06171a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.summon canvas{position:absolute;inset:0;width:100%;height:100%}
.reveal{position:relative;z-index:2;display:grid;gap:12px;width:100%;max-width:820px;grid-template-columns:repeat(5,minmax(0,1fr))}
.reveal.one{grid-template-columns:minmax(0,240px);justify-content:center}
.flip{perspective:800px}
.flip .in{transition:transform .5s cubic-bezier(.2,.8,.3,1.2);transform-style:preserve-3d;position:relative}
.flip .back,.flip .front{backface-visibility:hidden}
.flip .back{position:absolute;inset:0;border-radius:16px;background:repeating-linear-gradient(45deg,#1b5560 0 10px,#174750 10px 20px);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:34px;color:var(--sun)}
.flip .front{transform:rotateY(180deg)}
.flip.open .in{transform:rotateY(180deg)}
.flip.open .front{box-shadow:0 0 30px color-mix(in srgb,var(--rc) 60%,transparent)}
.summon .bar{position:relative;z-index:2;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.dupe{font-size:12px;margin-top:4px;color:var(--muted)}
.newtag{color:var(--sun);font-weight:800}

/* match */
.scorebar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;margin-bottom:12px}
.pcard{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:16px;padding:10px 14px;border:2px solid var(--line);min-width:0}
.pcard.me{border-color:color-mix(in srgb,var(--mint) 60%,transparent)}
.pcard.op{border-color:color-mix(in srgb,var(--coral) 60%,transparent);flex-direction:row-reverse;text-align:right}
.pcard .nm{font-family:var(--display);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pips{display:flex;gap:5px}
.pips i{width:16px;height:16px;border-radius:50%;background:var(--bg2);border:2px solid var(--line)}
.me .pips i.on{background:var(--mint);border-color:var(--mint);box-shadow:0 0 10px var(--mint)}
.op .pips i.on{background:var(--coral);border-color:var(--coral);box-shadow:0 0 10px var(--coral)}
.rnd{text-align:center}
.rnd b{font-family:var(--display);font-size:24px;display:block;line-height:1}
.rnd span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stage{position:relative;background:var(--panel);border-radius:22px;border:1px solid var(--line);padding:16px;min-height:300px}
.armies{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px}
.army{background:var(--panel);border-radius:16px;padding:10px 12px;border-left:4px solid var(--mint);min-width:0}
.army.op{border-left-color:var(--coral)}
.army h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg2);border-radius:999px;padding:2px 10px 2px 2px;font-size:13px;border:1px solid color-mix(in srgb,var(--rc) 50%,transparent)}
.chip img{width:26px;height:26px}
.chip b{font-variant-numeric:tabular-nums}
.chip.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.25)}}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;min-height:280px}
.spin{width:46px;height:46px;border-radius:50%;border:5px solid var(--bg2);border-top-color:var(--sun);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pickhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.pickhead h3{flex:1;min-width:0}
.timer{font-family:var(--display);font-size:22px;color:var(--sun);font-variant-numeric:tabular-nums}
.oppstat{font-size:13px;color:var(--muted)}
.oppstat.ok{color:var(--coral)}
.arc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:18px;align-items:start}
.arc-l{display:flex;flex-direction:column;gap:10px;align-items:center;min-width:0}
.arc-cv{width:100%;max-width:420px}
.arc-cv canvas{width:100%;display:block;aspect-ratio:400/560;border-radius:18px;touch-action:none}
.arc-help{text-align:center;font-size:12.5px}
.arc-r{display:flex;flex-direction:column;gap:12px;min-width:0}
.hudgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hudgrid div{background:var(--bg2);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.hudgrid span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hudgrid b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1;white-space:nowrap}
.tbar{height:8px;border-radius:8px;background:var(--bg2);overflow:hidden}
.tbar i{display:block;height:100%;width:0;background:var(--sun);transition:width .1s linear}
.lastbox{--rc:var(--line);display:flex;gap:12px;align-items:center;background:var(--bg2);border-radius:14px;padding:10px;min-height:84px;border:2px solid color-mix(in srgb,var(--rc) 60%,transparent)}
.lastbox img{width:64px;height:64px;flex:none}
.lastbox b{font-family:var(--display);font-weight:400;font-size:20px;display:block;line-height:1.1}
.lastbox .rar{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.lastbox.pop{animation:pop .35s}
.mini-h{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.oppbox{background:var(--bg2);border-radius:14px;padding:10px;border-left:4px solid var(--coral);display:flex;flex-direction:column;gap:8px}
.muster{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.muster-col{background:var(--bg2);border-radius:16px;padding:14px;border-top:4px solid var(--mint);display:flex;flex-direction:column;gap:8px;min-width:0}
.muster-col.op{border-top-color:var(--coral)}
.rarline{font-size:14px;font-weight:700}
.costdots{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.costdots i{width:10px;height:10px;border-radius:50%;background:#3bff6e;box-shadow:0 0 6px rgba(59,255,110,.6)}
.detail .costdots{justify-content:flex-start}
.grid.pick3{grid-template-columns:repeat(3,minmax(0,200px));justify-content:center}
@media (max-width:520px){.grid.pick3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.home-link{color:var(--muted);text-decoration:none;font-weight:700;font-size:14px;padding:6px 10px;border-radius:10px;background:var(--panel)}
.home-link:hover{color:var(--text)}
.bwrap{position:relative}
.bwrap canvas{width:100%;display:block;aspect-ratio:1000/560;border-radius:14px;background:#123d33}
.bctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.hud{flex:1;min-width:180px;display:flex;gap:8px;align-items:center;font-size:13px}
.hud .hb{flex:1;height:10px;border-radius:10px;background:var(--bg2);overflow:hidden;display:flex}
.hud .hb i{display:block;height:100%}
.overlay{position:absolute;inset:0;border-radius:22px;background:rgba(5,22,25,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;z-index:5;animation:fin .3s}
@keyframes fin{from{opacity:0}}
.big{font-family:var(--display);font-size:clamp(40px,8vw,72px);line-height:1}
.win{color:var(--mint);text-shadow:0 5px 0 #0c6b52} .lose{color:var(--coral);text-shadow:0 5px 0 #7a2014} .draw{color:var(--sun)}
.hist{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hist span{font-size:12px;border-radius:999px;padding:3px 10px;background:var(--bg2)}
.warn{background:color-mix(in srgb,var(--coral) 25%,var(--panel));border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.input,select{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--text);font:inherit;min-width:0}
.code{font-family:var(--display);font-size:44px;letter-spacing:.18em;color:var(--sun);user-select:all}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);font-weight:700;padding:10px 16px;border-radius:12px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center;animation:fin .2s}
.mp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.note{font-size:13px;color:var(--muted);max-width:70ch}
@media (max-width:820px){
  .hero,.gacha,.arc,.detail,.muster{grid-template-columns:minmax(0,1fr)}
  .hero canvas{max-width:300px;margin:0 auto}
  .tiles,.mp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .reveal{grid-template-columns:repeat(3,minmax(0,1fr))}
  .detail canvas{margin:0 auto}
}
@media (max-width:520px){
  .tiles,.mp-grid{grid-template-columns:minmax(0,1fr)}
  .tile.big{grid-column:auto}
  .armies{grid-template-columns:minmax(0,1fr)}
  .scorebar{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .rnd{grid-column:1/-1;order:-1}
  .pcard .nm{font-size:16px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  .stage{padding:10px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div id="app">
  <header class="top">
    <button class="logo" data-act="home" aria-label="Pegfall Arena home"><i></i><span>PEGFALL <b>ARENA</b></span></button>
    <div class="spacer"></div>
    <span class="pill" id="netpill"><span class="dot"></span><span id="nettext">Checking online…</span></span>
    <span class="pill"><span class="shard"></span><span class="num" id="shards">0</span></span>
  </header>
  <main id="main"></main>
</div>
