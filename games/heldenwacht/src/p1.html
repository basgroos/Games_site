<meta charset="utf-8">
<title>Heldenwacht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: comic-panel app shell. Top bar + one screen at a time; the match is HUD / board + side panel / hero deck. Single dark "night patrol" look by choice. */
:root{
  --ink:#0c0a1d; --panel:#17133a; --panel2:#211b4c; --panel3:#2c2560; --line:#3b3478;
  --text:#eeebff; --muted:#a39ecb; --dim:#716b9e;
  --pow:#ffd23f; --pow-ink:#1d1500; --danger:#ff4d5e; --good:#3ddc97; --edge:#05040d; --sky:#6ea8ff;
  --r-common:#a3acb9; --r-uncommon:#4ade80; --r-rare:#38bdf8; --r-epic:#c084fc; --r-legendary:#fbbf24; --r-mythic:#ff4f8b; --r-exotic:#2dd4bf; --r-ultra:#fde68a;
  --f-display:'Bungee', Impact, 'Arial Black', system-ui, sans-serif;
  --f-body:'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-num:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --shadow:4px 4px 0 var(--edge);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1.5px);background-size:14px 14px;}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--pow);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
#app{min-height:100%;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 16px;background:var(--panel);border-bottom:3px solid var(--edge)}
.logo{font-family:var(--f-display);font-size:22px;color:var(--pow);text-shadow:2px 2px 0 var(--edge);cursor:pointer;background:none;border:0;padding:0;transform:skew(-6deg)}
.nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.nav button{background:transparent;border:2px solid transparent;border-radius:4px;padding:6px 12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.nav button:hover{color:var(--text);background:var(--panel2)}
.nav button[aria-current="page"]{color:var(--pow-ink);background:var(--pow);border-color:var(--edge);box-shadow:2px 2px 0 var(--edge)}
.coins{display:flex;align-items:center;gap:8px;background:var(--edge);border:2px solid var(--pow);border-radius:999px;padding:4px 14px 4px 6px;font-family:var(--f-num);font-size:18px;font-weight:700;color:var(--pow)}
.coin-ico{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffd23f 45%,#c98a00);border:2px solid var(--edge);display:inline-block;flex:none}
.coin-ico.sm{width:15px;height:15px;border-width:1.5px;vertical-align:-2px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--edge);border-radius:4px;padding:9px 16px;font-weight:700;
  background:var(--panel3);color:var(--text);box-shadow:3px 3px 0 var(--edge);transition:transform .08s, box-shadow .08s, filter .15s;text-transform:uppercase;letter-spacing:.04em;font-size:14px}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--edge)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-pow{background:var(--pow);color:var(--pow-ink)}
.btn-good{background:var(--good);color:#032014}
.btn-danger{background:var(--danger);color:#1f0006}
.btn-sky{background:var(--sky);color:#04122b}
.btn-mega{background:linear-gradient(135deg,#7f1d1d,#b91c1c);color:#fff5f5}.mi-kind.k-mega{background:#b91c1c;color:#fff}
.mega-req{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:999px;font-weight:700;font-size:13px;border:2px solid var(--edge)}.mega-req.ok{background:rgba(61,220,151,.15);color:var(--good)}.mega-req.bad{background:rgba(255,77,94,.15);color:var(--danger)}
.btn-xl{font-family:var(--f-display);font-weight:400;font-size:26px;padding:12px 34px;transform:skew(-6deg);box-shadow:6px 6px 0 var(--edge)}
.btn-xl:active:not(:disabled){transform:skew(-6deg) translate(4px,4px)}
.btn-sm{padding:5px 10px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--edge);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--panel2);text-transform:uppercase;letter-spacing:.05em}
.rar{color:#0b0a14;border-color:var(--edge)}
.rar-common{background:var(--r-common)}.rar-uncommon{background:var(--r-uncommon)}.rar-rare{background:var(--r-rare)}
.rar-epic{background:var(--r-epic)}.rar-legendary{background:var(--r-legendary)}
.rar-mythic{background:linear-gradient(90deg,#ff4f8b,#ffb347,#7cf5c4,#6ea8ff,#c084fc);background-size:200% 100%;animation:rainbow 3s linear infinite}
@keyframes rainbow{to{background-position:200% 0}}
.rar-exotic{background:linear-gradient(90deg,#2dd4bf,#a3e635,#67e8f9,#c084fc,#2dd4bf);background-size:300% 100%;animation:rainbow 2.2s linear infinite}
.rar-ultra{background:linear-gradient(90deg,#fde68a,#ffffff,#c4b5fd,#0a0a0a,#fde68a);background-size:300% 100%;animation:rainbow 2.6s linear infinite;color:#0b0a14;box-shadow:0 0 10px rgba(253,230,138,.7)}
.role{background:var(--panel3);color:var(--text)}
.excl{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.08em;padding:0 5px;border-radius:3px;background:linear-gradient(90deg,#2dd4bf,#c084fc);color:#0b0a14;vertical-align:1px}

/* ---------- panels & screens ---------- */
.panel{background:var(--panel);border:2px solid var(--edge);border-radius:6px;box-shadow:var(--shadow)}
.screen{padding-block:20px 40px;padding-inline:16px;max-width:1240px;width:100%;margin:0 auto}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.screen-head h2{font-size:30px;color:var(--pow);text-shadow:3px 3px 0 var(--edge)}
.kicker{font-family:var(--f-num);text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--muted);font-weight:700}
.section-title{font-family:var(--f-num);text-transform:uppercase;letter-spacing:.1em;font-size:14px;font-weight:700;color:var(--muted);margin:18px 0 8px}

/* home */
.home-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:1.2fr 1fr;min-height:320px;
  background:linear-gradient(160deg,#241c5c,#120e30 70%)}
.home-hero canvas{width:100%;height:100%;display:block;min-height:240px}
.home-copy{padding:28px;display:flex;flex-direction:column;justify-content:center;gap:14px;min-width:0}
.home-copy h1{font-size:clamp(38px,6vw,64px);line-height:.95;color:var(--pow);text-shadow:4px 4px 0 var(--edge),-1px -1px 0 var(--edge);transform:skew(-6deg)}
.home-copy p{margin:0;max-width:40ch;color:#d7d3f5;font-size:17px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:20px}
.home-card{padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.home-card h3{font-size:18px}
.loop{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:s}
.loop li{counter-increment:s;display:flex;gap:10px;align-items:center;font-weight:600}
.loop li::before{content:counter(s);font-family:var(--f-display);width:26px;height:26px;flex:none;border-radius:50%;background:var(--pow);color:var(--pow-ink);display:grid;place-items:center;font-size:13px;border:2px solid var(--edge)}
.bar{height:10px;border-radius:99px;background:var(--edge);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--pow)}

/* maps */
.maps-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:18px;align-items:start}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.map-card{padding:0;text-align:left;overflow:hidden;position:relative;background:var(--panel);display:flex;flex-direction:column}
.map-card canvas{width:100%;aspect-ratio:24/15;display:block;border-bottom:2px solid var(--edge);max-width:100%}
.map-card .mc-body{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.map-card .mc-name{font-family:var(--f-display);font-size:15px}
.map-card[aria-pressed="true"]{outline:3px solid var(--pow);outline-offset:0}
.map-card.locked canvas{filter:grayscale(1) brightness(.35)}
.lock-tag{position:absolute;top:8px;left:8px;background:var(--edge);color:var(--muted);padding:3px 8px;border-radius:4px;font-size:12px;font-weight:700}
.stars{color:var(--pow);letter-spacing:1px;font-size:14px;white-space:nowrap}
.stars .off{color:var(--dim)}
.map-detail{padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:80px}
.map-detail canvas{width:100%;aspect-ratio:24/15;border:2px solid var(--edge);border-radius:4px;max-width:100%}
.diffs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.diff{padding:10px;text-align:left;background:var(--panel2);border:2px solid var(--edge);border-radius:4px;display:flex;flex-direction:column;gap:2px}
.diff[aria-pressed="true"]{background:var(--pow);color:var(--pow-ink)}
.diff[aria-pressed="true"] .muted{color:#4a3c00}
.diff:disabled{opacity:.5;cursor:not-allowed}
.diff b{font-family:var(--f-display);font-weight:400;font-size:15px}
.enemy-chips{display:flex;flex-wrap:wrap;gap:6px}
.team-strip{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.team-strip canvas{width:44px;height:44px;border-radius:4px;border:2px solid var(--edge);background:var(--panel2)}

/* hero cards */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.hcard{position:relative;padding:0;background:var(--panel2);border:2px solid var(--edge);border-radius:6px;box-shadow:3px 3px 0 var(--edge);overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .12s}
.hcard:hover{transform:translateY(-3px)}
.hcard canvas{width:100%;aspect-ratio:1;display:block;max-width:100%}
.hcard .hc-body{padding:8px 10px 10px;border-top:4px solid var(--rc,#888);display:flex;flex-direction:column;gap:2px;min-width:0}
.hcard .hc-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard .hc-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:var(--f-num);font-weight:600;letter-spacing:.04em}
.hcard .badge{position:absolute;top:6px;right:6px;background:var(--edge);color:var(--pow);font-family:var(--f-num);font-weight:700;font-size:13px;padding:1px 7px;border-radius:4px}
.hcard .badge-l{left:6px;right:auto;color:var(--text)}
.hcard.unowned .hc-name{color:var(--dim)}
.hcard.in-team{outline:3px solid var(--good);outline-offset:-3px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:2px solid var(--edge);background:var(--panel2);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.filters button[aria-pressed="true"]{background:var(--pow);color:var(--pow-ink)}

/* team */
.team-layout{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:18px;align-items:start}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{aspect-ratio:1;border:2px dashed var(--line);border-radius:6px;display:grid;place-items:center;color:var(--dim);font-weight:700;position:relative;background:var(--panel2);padding:0;overflow:hidden}
.slot.filled{border-style:solid;border-color:var(--edge)}
.slot canvas{width:100%;height:100%}
.slot .x{position:absolute;top:4px;right:4px;background:var(--danger);color:#1f0006;border:2px solid var(--edge);border-radius:4px;width:22px;height:22px;display:grid;place-items:center;font-weight:900;font-size:13px;line-height:1}
.slot .nm{position:absolute;bottom:0;left:0;right:0;background:rgba(5,4,13,.8);font-size:12px;padding:2px 4px;text-align:center;color:var(--text)}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check .dot{width:10px;height:10px;border-radius:50%;background:var(--danger);flex:none}
.check .dot.ok{background:var(--good)}

/* gacha */
.gacha-layout{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:start}
.gacha-list{display:flex;flex-direction:column;gap:12px}
.gcard{padding:14px;text-align:left;display:flex;gap:12px;align-items:center;background:var(--panel);position:relative}
.gcard[aria-pressed="true"]{outline:3px solid var(--pow)}
.gcard.locked{opacity:.55}
.capsule-ico{width:54px;height:54px;border-radius:50%;flex:none;border:3px solid var(--edge);position:relative;overflow:hidden;background:linear-gradient(180deg,var(--g1) 0 50%,#f4f1ff 50%)}
.capsule-ico::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 2px);height:4px;background:var(--edge)}
.gacha-detail{padding:18px;display:flex;flex-direction:column;gap:14px}
.rates{display:grid;gap:6px}
.rate-row{display:grid;grid-template-columns:110px 1fr 64px;gap:10px;align-items:center}
.rate-row .bar{height:14px}
.rate-row .pct{text-align:right;font-family:var(--f-num);font-weight:700;font-size:16px}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pool-item{background:var(--panel2);border:2px solid var(--edge);border-radius:4px;padding:0 0 6px;text-align:center;font-size:12px;position:relative;overflow:hidden}
.pool-item canvas{width:100%;aspect-ratio:1;display:block;border-bottom:3px solid var(--rc)}
.pool-item .pn{font-weight:700;padding:4px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pool-item .pr{font-family:var(--f-num);color:var(--muted)}
.pool-item .own{position:absolute;top:4px;left:4px;background:var(--good);color:#032014;border-radius:3px;padding:0 5px;font-weight:800;font-size:11px}
.pool-item.feat{box-shadow:0 0 0 2px var(--pow)}
.pull-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.event-timer{font-family:var(--f-num);font-weight:700;color:var(--pow);font-size:16px}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,4,13,.82);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.modal-card{width:min(980px,100%);max-height:calc(100% - 8px);overflow:auto;position:relative;padding:20px}
.close-x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:4px;border:2px solid var(--edge);background:var(--panel3);font-weight:900;font-size:18px;z-index:2}
.hero-modal{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:22px}
.hm-stage{background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--rc) 35%,transparent),transparent 65%),var(--panel2);border:2px solid var(--edge);border-radius:6px;overflow:hidden}
.hm-stage canvas{width:100%;aspect-ratio:1;display:block;max-width:100%}
.tier-pick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tier-pick button{width:34px;height:34px;border:2px solid var(--edge);border-radius:4px;background:var(--panel2);font-weight:800}
.tier-pick button[aria-pressed="true"]{background:var(--pow);color:var(--pow-ink)}
.stat-table{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;min-width:0}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--f-num);font-size:19px;font-weight:700}
.upg-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.upg-list li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:7px 10px}
.upg-list .tn{font-family:var(--f-display);width:28px;height:28px;border-radius:4px;display:grid;place-items:center;background:var(--panel3);border:2px solid var(--edge);font-size:13px}
.upg-list li.major .tn{background:var(--pow);color:var(--pow-ink)}
.upg-list li.done{border-color:var(--good)}
.upg-list li.done .tn{background:var(--good);color:#032014}
.upg-list .ud{font-size:13px;color:var(--muted)}
.upg-list .un{font-weight:700;font-size:14px}
.ability-box{border:2px solid var(--edge);border-radius:6px;padding:10px 12px;background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 25%,var(--panel2)),var(--panel2))}
.ability-box b{font-family:var(--f-display);font-weight:400}

/* settings */
.settings{max-width:680px;display:grid;gap:12px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 16px;flex-wrap:wrap}
.set-row label{font-weight:700}
.set-row .muted{font-size:13px;display:block;font-weight:400}
.toggle{width:54px;height:30px;border-radius:99px;border:2px solid var(--edge);background:var(--panel3);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .15s}
.toggle[aria-pressed="true"]{background:var(--good)}
.toggle[aria-pressed="true"]::after{left:27px;background:#fff}
input[type=range]{accent-color:var(--pow);width:200px;max-width:100%}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
kbd{font-family:var(--f-num);font-weight:700;background:var(--panel3);border:2px solid var(--edge);border-bottom-width:4px;border-radius:4px;padding:0 7px}

/* ---------- game screen ---------- */
#scr-game{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:#07061a;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--panel);border-bottom:3px solid var(--edge)}
.hud .pill{display:flex;align-items:center;gap:6px;background:var(--edge);border:2px solid var(--line);border-radius:6px;padding:3px 10px;font-family:var(--f-num);font-weight:700;font-size:18px;min-width:0}
.hud .pill small{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-family:var(--f-body)}
.hud .pill.hp{border-color:#ff4d5e}
.hud .pill.cash{border-color:var(--pow);color:var(--pow)}
.hp-bar{width:90px;height:10px;border-radius:99px;background:#2a0a12;overflow:hidden}
.hp-bar i{display:block;height:100%;background:linear-gradient(90deg,#ff4d5e,#ff8a5b);transition:width .2s}
.hud .spacer{flex:1}
.seg{display:flex;border:2px solid var(--edge);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--panel3);padding:6px 10px;font-weight:800;font-family:var(--f-num);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--pow);color:var(--pow-ink)}
.seg button.turbo{color:#fb923c}.seg button.turbo[aria-pressed="true"]{background:#f97316;color:#1c0a00}
@media (max-width:900px){.ff .seg button{padding:6px 7px;font-size:14px}}
.g-main{flex:1;min-height:0;display:flex}
.canvas-box{flex:1;min-width:0;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:8px}
.canvas-box canvas{display:block;border:3px solid var(--edge);border-radius:6px;touch-action:none;box-shadow:0 0 0 1px var(--line)}
.side{width:320px;flex:none;background:var(--panel);border-left:3px solid var(--edge);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.side h3{font-size:18px}
.sel-head{display:flex;gap:12px;align-items:center}
.sel-head canvas{width:64px;height:64px;border-radius:6px;border:2px solid var(--edge);background:var(--panel2);flex:none}
.pips{display:flex;gap:4px;margin-top:4px}
.pips i{width:16px;height:6px;border-radius:2px;background:var(--panel3);border:1px solid var(--edge)}
.pips i.on{background:var(--pow)}
.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px}
.mini-stats div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:2px 0;gap:6px}
.mini-stats b{font-family:var(--f-num);font-size:15px}
.mini-stats .up{color:var(--good)}
.target-modes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}

/* gacha reveal */
#reveal{background:radial-gradient(circle at 50% 45%,#2a1f6b,#05040d 70%)}
.reveal-stage{width:min(1000px,100%);display:flex;flex-direction:column;align-items:center;gap:20px}
.capsule{width:150px;height:150px;border-radius:50%;border:5px solid var(--edge);background:linear-gradient(180deg,var(--c) 0 50%,#f4f1ff 50%);position:relative;animation:shake .9s ease-in-out;box-shadow:0 0 60px var(--c)}
.capsule::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 4px);height:8px;background:var(--edge)}
.capsule.pop{animation:pop .35s forwards}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg)}30%{transform:rotate(12deg)}45%{transform:rotate(-10deg)}60%{transform:rotate(9deg) scale(1.05)}75%{transform:rotate(-6deg) scale(1.1)}90%{transform:rotate(3deg) scale(1.15)}}
@keyframes pop{to{transform:scale(2.4);opacity:0;filter:brightness(3)}}
#reveal.mega::before{content:"";position:fixed;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.08) 0 6deg,transparent 6deg 18deg);animation:spin 12s linear infinite;pointer-events:none}
#reveal.mega .capsule{animation:shake 1.8s ease-in-out;box-shadow:0 0 120px var(--c),0 0 40px #fff}
@keyframes spin{to{transform:rotate(360deg)}}
.mega-title{font-family:var(--f-display);font-size:clamp(28px,6vw,54px);color:var(--c);text-shadow:4px 4px 0 var(--edge);transform:skew(-6deg);animation:tin .4s ease-out}

.rcard.show .rcard-in{transform:rotateY(0)}
.rface{backface-visibility:hidden;background:var(--panel2);border:3px solid var(--edge);border-radius:8px;overflow:hidden;box-shadow:0 0 0 3px var(--rc),0 0 30px var(--rc)}
.rback{position:absolute;inset:0;backface-visibility:hidden;transform:rotateY(180deg);border:3px solid var(--edge);border-radius:8px;background:repeating-linear-gradient(45deg,#2c2560 0 10px,#211b4c 10px 20px)}
.rface canvas{width:100%;aspect-ratio:1;display:block;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--rc) 45%,transparent),transparent 70%)}

.reveal-flash{position:fixed;inset:0;pointer-events:none;background:var(--c);opacity:0;animation:flash .6s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.rcard.l-legendary .rface,.rcard.l-mythic .rface,.rcard.l-exotic .rface,.rcard.l-ultra .rface{animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 3px var(--rc),0 0 60px var(--rc)}}

.toasts{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:calc(100% - 32px)}

@keyframes tin{from{transform:translateY(10px);opacity:0}}
