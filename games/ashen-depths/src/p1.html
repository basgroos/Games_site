<title>Ashen Depths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: full-bleed pixel canvas; DOM overlays framed like carved stone slabs (HUD corners, ledger-style modal panels) */
:root{
  --ink:#0c0a10; --slab:#16111c; --slab2:#211a29; --edge:#4a3d52; --edge-hi:#7a6684;
  --bone:#eadfc4; --dim:#9d8fa3; --gold:#e8b04a; --blood:#c9433b; --mana:#4f86e0; --xp:#79c96b; --good:#7bd88a; --bad:#ff6b5e;
  --r0:#b9b1a2; --r1:#6fc46a; --r2:#5a9cf0; --r3:#b769ea; --r4:#f0a830; --r5:#ff4d6d;
  --f-display:'Silkscreen','Courier New',monospace;
  --f-body:'VT323','Courier New',monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--f-body);font-size:20px;line-height:1.15;overflow:hidden;-webkit-font-smoothing:none}
#app{position:fixed;inset:0;overflow:hidden}
canvas#game{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block;cursor:crosshair}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:22px;color:var(--gold)} h3{font-size:14px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em}
.px{background:rgba(22,17,28,.94);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px #000,inset 0 3px 0 2px rgba(255,255,255,.04);
  clip-path:polygon(0 5px,5px 5px,5px 0,calc(100% - 5px) 0,calc(100% - 5px) 5px,100% 5px,100% calc(100% - 5px),calc(100% - 5px) calc(100% - 5px),calc(100% - 5px) 100%,5px 100%,5px calc(100% - 5px),0 calc(100% - 5px))}
.btn{font:400 13px/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--bone);background:#2a2231;border:2px solid #000;
  box-shadow:inset 0 0 0 2px var(--edge),inset 0 -4px 0 rgba(0,0,0,.45);padding:10px 14px 12px;cursor:pointer;white-space:nowrap}
.btn:hover:not([disabled]){box-shadow:inset 0 0 0 2px var(--gold),inset 0 -4px 0 rgba(0,0,0,.45);color:#fff}
.btn:active:not([disabled]){transform:translateY(2px)}
.btn:focus-visible,.card:focus-visible,.slotbox:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.primary{background:#7a4c14;color:#fff3d6;box-shadow:inset 0 0 0 2px #e8b04a,inset 0 -4px 0 rgba(0,0,0,.4)}
.btn.danger{background:#5a1c1c}
.btn.small{font-size:11px;padding:6px 9px 8px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--dim)} .gold{color:var(--gold)} .good{color:var(--good)} .bad{color:var(--bad)}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}.r4{color:var(--r4)}.r5{color:var(--r5)}
.tabnum{font-variant-numeric:tabular-nums}
img.pix{image-rendering:pixelated}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud-tl{position:absolute;left:12px;top:12px;width:268px;padding:10px 12px;display:grid;gap:6px}
.hrow{display:flex;gap:10px;align-items:center}
#portrait{width:40px;height:40px;image-rendering:pixelated;background:#0a070d;border:2px solid #000;box-shadow:inset 0 0 0 1px var(--edge)}
#h-name{font:13px var(--f-display);color:var(--gold)} #h-sub{font-size:17px;color:var(--dim)}
.bar{position:relative;height:16px;background:#0a070d;border:2px solid #000;box-shadow:inset 0 0 0 1px #2c2433}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.25)}
.bar u{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.55)}
.bar b{position:absolute;inset:0;text-align:center;font:400 16px/14px var(--f-body);color:#fff;text-shadow:1px 1px 0 #000}
.bar.hp{--c:var(--blood)} .bar.mp{--c:var(--mana)} .bar.xp{--c:var(--xp);height:9px} .bar.xp b{display:none}
.bar.sh{--c:#e8e0a0;height:6px}
.hstats{display:flex;justify-content:space-between;font-size:18px}
.hstats b{font-weight:400;color:var(--bone)}
#hud-tr{position:absolute;right:12px;top:12px;display:grid;gap:6px;justify-items:end}
#mmwrap{padding:6px}
#minimap{display:block;width:168px;height:134px;image-rendering:pixelated}
#h-loc{padding:6px 10px;text-align:right;min-width:168px}
#h-loc .t{font:12px var(--f-display);color:var(--gold)} #h-loc .s{font-size:17px;color:var(--dim)}
#bossbar{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(560px,calc(100% - 620px));min-width:260px;text-align:center}
#boss-name{font:14px var(--f-display);color:#ffd9c8;text-shadow:2px 2px 0 #000;margin-bottom:4px;letter-spacing:.08em}
.bar.boss{height:16px;--c:linear-gradient(#e0483a,#8a1f1a)}
#abar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;padding:8px}
.slot{position:relative;width:46px;height:46px;background:#0e0a12;border:2px solid #000;box-shadow:inset 0 0 0 2px var(--edge)}
.slot img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);image-rendering:pixelated}
.slot .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.78) calc(var(--p,0)*1turn),transparent 0)}
.slot .k{position:absolute;left:3px;top:1px;font:10px var(--f-display);color:var(--gold);text-shadow:1px 1px 0 #000}
.slot .n{position:absolute;right:3px;bottom:0;font-size:16px;text-shadow:1px 1px 0 #000}
.slot.off img{filter:grayscale(1) brightness(.5)}
.slot.sep{margin-left:8px}
#buffs{position:absolute;left:12px;top:212px;display:flex;flex-direction:column;gap:3px;font-size:17px}
#buffs div{background:rgba(10,7,13,.75);padding:1px 6px;border-left:3px solid var(--c,#e8b04a)}
#combo{position:absolute;right:16px;top:230px;text-align:right;font:16px var(--f-display);color:var(--gold);text-shadow:2px 2px 0 #000}
#combo small{display:block;font:18px var(--f-body);color:var(--dim)}
#prompt{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);padding:6px 12px;font-size:19px;white-space:nowrap}
#prompt kbd{font:11px var(--f-display);background:var(--gold);color:#1a1008;padding:2px 5px;margin-right:6px}
#toasts{position:absolute;left:50%;top:84px;transform:translateX(-50%);display:grid;gap:4px;justify-items:center}
.toast{padding:5px 12px;font-size:19px;animation:toast 3s forwards}
.toast.ach{border-color:var(--gold)}
@keyframes toast{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#banner{position:absolute;left:0;right:0;top:32%;text-align:center;pointer-events:none;opacity:0}
#banner.show{animation:banner 3.2s forwards}
#banner .a{font:14px var(--f-display);color:var(--dim);letter-spacing:.3em}
#banner .b{font:clamp(24px,4vw,44px) var(--f-display);color:var(--bone);text-shadow:3px 3px 0 #000,0 0 18px rgba(232,176,74,.35)}
#banner.boss .b{color:#ff8a70}
@keyframes banner{0%{opacity:0;letter-spacing:.3em}15%{opacity:1;letter-spacing:.02em}80%{opacity:1}100%{opacity:0}}
#hotkeys{position:absolute;left:12px;bottom:12px;font-size:16px;color:var(--dim);text-shadow:1px 1px 0 #000}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}
#vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 rgba(200,20,20,0);transition:box-shadow .2s}

/* ---------- Modal panels ---------- */
#modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,4,10,.62);padding:16px;z-index:10}
#modal-box{width:min(980px,100%);max-height:calc(100% - 8px);overflow:auto;padding:18px 20px 20px;display:grid;gap:14px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs .btn.on{background:#4a3a18;box-shadow:inset 0 0 0 2px var(--gold),inset 0 -4px 0 rgba(0,0,0,.45);color:#fff}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
@media (max-width:720px){.split{grid-template-columns:minmax(0,1fr)}}
.grid-inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px}
.slotbox{position:relative;aspect-ratio:1;max-width:100%;background:#0e0a12;border:2px solid #000;box-shadow:inset 0 0 0 2px var(--rc,#2c2433);cursor:pointer;display:grid;place-items:center;padding:0}
.slotbox img{width:78%;height:78%;image-rendering:pixelated}
.slotbox.sel{box-shadow:inset 0 0 0 2px #fff}
.slotbox.empty{cursor:default;opacity:.55}
.slotbox .lbl{position:absolute;left:3px;top:1px;font:8px var(--f-display);color:var(--dim)}
.slotbox .glow{position:absolute;inset:4px;box-shadow:0 0 10px var(--rc);opacity:.6;pointer-events:none}
.equip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
@media (max-width:520px){.equip{grid-template-columns:repeat(4,minmax(0,1fr))}}
.detail{background:#0f0b14;border:2px solid #000;box-shadow:inset 0 0 0 2px #2c2433;padding:12px 14px;display:grid;gap:6px;align-content:start;min-width:0}
.detail .nm{font:14px var(--f-display);line-height:1.3}
.detail .sub{color:var(--dim);font-size:18px}
.detail ul{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.detail li{font-size:19px}
.power{color:var(--r4);font-size:19px}
.cmp{font-size:18px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 18px}
.statgrid div{display:flex;justify-content:space-between;border-bottom:1px dashed #2c2433;padding:2px 0}
.statgrid b{font-weight:400;font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{background:#0f0b14;border:2px solid #000;box-shadow:inset 0 0 0 2px var(--cc,#3a2f44);padding:14px;display:grid;gap:6px;cursor:pointer;text-align:left;align-content:start}
.card:hover{box-shadow:inset 0 0 0 2px var(--gold)}
.card.on{box-shadow:inset 0 0 0 3px var(--gold);background:#1c1520}
.card.locked{opacity:.5}
.card .t{font:13px var(--f-display);color:var(--cc,var(--bone))}
.card .d{font-size:18px;color:var(--dim)}
.abil{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;background:#0f0b14;border:2px solid #000;box-shadow:inset 0 0 0 2px #2c2433;padding:10px}
.abil img{width:48px;height:48px;image-rendering:pixelated}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.pips i{width:8px;height:8px;background:#2c2433;display:inline-block}
.pips i.on{background:var(--gold)}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.shopitem{background:#0f0b14;border:2px solid #000;box-shadow:inset 0 0 0 2px var(--rc,#2c2433);padding:8px;display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;align-items:center;cursor:pointer;text-align:left}
.shopitem.sel{box-shadow:inset 0 0 0 2px #fff}
.shopitem img{width:36px;height:36px;image-rendering:pixelated}
.shopitem .p{color:var(--gold);font-size:18px}
.shopitem .nm{font-size:17px;line-height:1;overflow:hidden;text-overflow:ellipsis}
.sold{opacity:.35;pointer-events:none}
.ev-text{font-size:21px;max-width:62ch;line-height:1.25}
.death-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.death-stats div{background:#0f0b14;padding:10px;border:2px solid #000;box-shadow:inset 0 0 0 2px #2c2433}
.death-stats b{display:block;font:18px var(--f-display);color:var(--bone);font-weight:400}
.death-stats span{color:var(--dim);font-size:17px}
#mapcv{width:100%;max-width:100%;image-rendering:pixelated;background:#050407;border:2px solid #000}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:17px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.range{display:flex;gap:10px;align-items:center}
.range input{flex:1;accent-color:var(--gold)}

/* ---------- Hub ---------- */
#hub{position:absolute;inset:0;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,700px);gap:16px;padding-block:22px;padding-inline:max(16px,3vw);align-items:start}
@media (max-width:900px){#hub{grid-template-columns:minmax(0,1fr)}}
.logo{display:grid;gap:8px;padding-top:4vh}
.logo h1{font-size:clamp(34px,6vw,70px);line-height:.95;color:#f3e6c6;text-shadow:4px 4px 0 #000,0 0 30px rgba(232,120,40,.35)}
.logo p{margin:0;font-size:22px;color:var(--dim);max-width:34ch}
.shards{display:inline-flex;gap:8px;align-items:center;font:14px var(--f-display);color:#bfe8ff;padding:8px 12px;width:max-content}
.shards i{width:10px;height:14px;background:linear-gradient(#e0f6ff,#5ab8ff);clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%)}
.hubpanel{padding:16px 18px 18px;display:grid;gap:14px;min-width:0}
.sec{display:grid;gap:8px}
.cls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.cls{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cls .card{grid-template-columns:32px minmax(0,1fr);align-items:center;padding:10px}
.cls .card img{width:32px;height:32px;image-rendering:pixelated}
.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.regions .card{padding:9px 10px}
.regions .t{font-size:11px}
.clsinfo{font-size:19px;color:var(--dim)}
.clsinfo b{color:var(--bone);font-weight:400}
.list{display:grid;gap:6px}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:#0f0b14;border:2px solid #000;box-shadow:inset 0 0 0 2px #2c2433;padding:8px 12px}
.li.done{box-shadow:inset 0 0 0 2px #6a5424}
.li .t{font:12px var(--f-display);color:var(--bone)}
.li .d{font-size:18px;color:var(--dim)}
.best{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.best .li{grid-template-columns:40px minmax(0,1fr)}
.best canvas{width:40px;height:40px;image-rendering:pixelated}
.note{font-size:17px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){.toast,#banner.show{animation-duration:.01s}}
</style>

<div id="app">
  <canvas id="game"></canvas>
  <div id="flash"></div>
  <div id="vignette"></div>
  <div id="hud" hidden>
    <div id="hud-tl" class="px">
      <div class="hrow"><canvas id="portrait" width="14" height="14"></canvas><div><div id="h-name">Warrior</div><div id="h-sub">Level 1</div></div></div>
      <div class="bar hp"><u id="bu-hp"></u><i id="b-hp"></i><b id="t-hp"></b></div>
      <div class="bar sh" id="shbar" hidden><i id="b-sh" style="width:0"></i></div>
      <div class="bar mp"><i id="b-mp"></i><b id="t-mp"></b></div>
      <div class="bar xp"><i id="b-xp"></i><b></b></div>
      <div class="hstats"><span>Gold <b id="h-gold" class="gold">0</b></span><span>Luck <b id="h-luck">0</b></span><span>AP <b id="h-ap">0</b></span></div>
    </div>
    <div id="hud-tr"><div id="mmwrap" class="px"><canvas id="minimap" width="140" height="112"></canvas></div><div id="h-loc" class="px"><div class="t" id="h-area"></div><div class="s" id="h-floor"></div></div></div>
    <div id="bossbar" hidden><div id="boss-name"></div><div class="bar boss"><i id="b-boss"></i></div></div>
    <div id="buffs"></div>
    <div id="combo"></div>
    <div id="abar" class="px"></div>
    <div id="prompt" class="px" hidden></div>
    <div id="toasts"></div>
    <div id="banner"><div class="a" id="ban-a"></div><div class="b" id="ban-b"></div></div>
    <div id="hotkeys">I Inventory · C Character · K Abilities · M Map · Esc Menu · P Pause</div>
  </div>
  <div id="hub"></div>
  <div id="modal" hidden><div id="modal-box" class="px" role="dialog" aria-modal="true"></div></div>
</div>
