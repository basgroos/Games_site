<title>PULSE//SHIFT</title>
<style>
/* PULSE//SHIFT — menu overlay styles. The game itself is drawn on the canvas. */
:root {
  --bg: #07060f;
  --panel: rgba(10, 7, 26, 0.86);
  --line: rgba(160, 140, 255, 0.28);
  --text: #ece8ff;
  --dim: #9a93c4;
  --cyan: #5ff7ff;
  --pink: #ff4fd8;
  --danger: #ff2e7e;
  --violet: #a855ff;
  --gold: #ffe27a;
  --font: "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: var(--text); font-family: var(--font); overflow: hidden; }
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
canvas { display: block; background: var(--bg); }

#ui { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; overflow-y: auto; padding: 16px;
      background: radial-gradient(ellipse at center, rgba(7, 6, 15, 0.35), rgba(0, 0, 0, 0.78)); }
#ui.open { display: flex; }
.screen { width: min(980px, 100%); max-height: 100%; text-align: center; animation: in .25s ease-out; }
@keyframes in { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }

.logo { font-size: clamp(44px, 9vw, 96px); font-weight: 900; letter-spacing: .06em; line-height: 1;
        color: #fff; text-shadow: 0 0 18px var(--cyan), 0 0 42px rgba(95, 247, 255, .5); }
.logo span { color: var(--pink); text-shadow: 0 0 18px var(--pink), 0 0 40px rgba(255, 79, 216, .6); }
.tag { margin: 12px 0 30px; color: var(--dim); letter-spacing: .2em; text-transform: uppercase; font-size: 13px; }
h2 { font-size: 34px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 18px; text-shadow: 0 0 16px rgba(255, 79, 216, .55); }
h4 { margin: 18px 0 8px; color: var(--dim); letter-spacing: .2em; text-transform: uppercase; font-size: 12px; font-weight: 700; }
.sub { color: var(--dim); margin-bottom: 18px; }

button { font: inherit; color: var(--text); background: rgba(20, 14, 48, .85); border: 1.5px solid var(--line); border-radius: 4px;
         cursor: pointer; transition: transform .08s, border-color .12s, background .12s, box-shadow .12s; }
button:hover:not([disabled]), button:focus-visible, button:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan), 0 0 18px rgba(95, 247, 255, .35); transform: translateY(-1px); }
button[disabled] { opacity: .45; cursor: not-allowed; }
button.on { border-color: var(--pink); background: rgba(255, 79, 216, .16); box-shadow: inset 0 0 0 1px var(--pink); }

.menu-col { display: flex; flex-direction: column; gap: 10px; width: min(340px, 100%); margin: 0 auto; }
.menu-col button { padding: 13px 18px; font-size: 18px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.menu-col em { font-style: normal; font-size: 11px; color: var(--bg); background: var(--gold); padding: 2px 6px; border-radius: 3px; margin-left: 8px; vertical-align: middle; letter-spacing: .05em; }

.controls { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; margin: 28px auto 8px; font-size: 13px; color: var(--dim); }
.controls b { color: var(--text); margin-right: 4px; letter-spacing: .1em; }
.controls .c-dash { color: var(--danger); } .controls .c-hop { color: var(--violet); } .controls .c-brk { color: var(--cyan); }
.hint, .smallnote { color: var(--dim); font-size: 12px; margin-top: 10px; opacity: .8; }

.cards { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.card { flex: 1 1 240px; max-width: 310px; padding: 18px 18px 16px; text-align: left; background: var(--panel); }
.card h3 { margin: 0 0 4px; font-size: 18px; letter-spacing: .12em; text-transform: uppercase; }
.card p { margin: 8px 0 0; color: var(--dim); font-size: 13px; line-height: 1.45; }
.card .sub { margin: 0; font-size: 12px; color: var(--pink); }
.card .pb { margin-top: 10px; font-size: 12px; color: var(--gold); }
.pb.center { text-align: center; color: var(--gold); font-size: 13px; }
.modedesc { color: var(--dim); }
.bossicon { width: 46px; height: 46px; margin-bottom: 10px; border: 3px solid var(--pink); }
.bossicon.oct { clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); background: rgba(255, 79, 216, .35); border: none; }
.bossicon.diamond { clip-path: polygon(50% 0, 80% 50%, 50% 100%, 20% 50%); background: #dff8ff; border: none; }
.bossicon.star { clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); background: var(--pink); border: none; }

.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.pill { padding: 9px 16px; font-size: 14px; font-weight: 600; }
.pill.mod { display: flex; flex-direction: column; text-align: left; max-width: 260px; }
.pill.mod small { color: var(--dim); font-weight: 400; font-size: 11px; margin-top: 3px; }
.pill.danger { border-color: rgba(255, 46, 126, .5); }
.val { min-width: 56px; font-family: var(--mono); }
button.big { padding: 13px 34px; font-size: 18px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; margin-top: 18px;
             background: linear-gradient(90deg, rgba(255, 79, 216, .3), rgba(95, 247, 255, .25)); border-color: var(--pink); }
button.big.alt { background: rgba(20, 14, 48, .85); border-color: var(--line); }
button.back { margin-top: 22px; padding: 8px 18px; font-size: 13px; background: transparent; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.swatch { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; text-align: left; }
.swatch small { color: var(--dim); font-size: 11px; }
.dots { display: flex; gap: 6px; padding: 6px 8px; border-radius: 3px; margin-bottom: 4px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; display: block; }

.settings { display: grid; grid-template-columns: 180px 1fr; gap: 10px 16px; align-items: center; text-align: left; max-width: 620px; margin: 0 auto; }
.settings label { color: var(--dim); font-size: 14px; }
.settings .row { justify-content: flex-start; margin: 0; }

table.records { margin: 0 auto; border-collapse: collapse; min-width: min(640px, 100%); background: var(--panel); }
.records th, .records td { padding: 10px 16px; border-bottom: 1px solid var(--line); }
.records th { text-align: left; color: var(--dim); font-size: 12px; letter-spacing: .12em; }
.records td b { display: block; font-size: 20px; color: var(--gold); }
.records td small { color: var(--dim); font-family: var(--mono); }
.records td.none { color: var(--line); }

.restitle { color: var(--dim); letter-spacing: .3em; font-size: 14px; text-transform: uppercase; }
.status { font-size: 26px; font-weight: 900; letter-spacing: .3em; margin: 6px 0; }
.status.ok { color: var(--cyan); text-shadow: 0 0 14px rgba(95, 247, 255, .6); }
.status.bad { color: var(--danger); }
.rank { font-size: 120px; font-weight: 900; line-height: 1; margin: 6px 0; color: #fff; text-shadow: 0 0 30px var(--pink); animation: rankpop .5s cubic-bezier(.2, 1.6, .4, 1); }
.rank-Sp, .rank-S { color: var(--gold); text-shadow: 0 0 30px var(--gold), 0 0 60px rgba(255, 226, 122, .5); }
.rank-A { color: var(--cyan); text-shadow: 0 0 30px var(--cyan); }
@keyframes rankpop { from { transform: scale(2.2); opacity: 0; } to { transform: none; opacity: 1; } }
.score { font-family: var(--mono); font-size: 34px; font-weight: 700; }
.newbest { color: var(--gold); font-weight: 800; letter-spacing: .2em; margin-top: 6px; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .4; } }
.prev { color: var(--dim); font-size: 13px; margin-top: 4px; }
.unlocks { margin: 10px auto 0; padding: 8px 14px; display: inline-block; border: 1px solid var(--gold); color: var(--gold); border-radius: 4px; font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 26px; max-width: 640px; margin: 18px auto 0; text-align: left; }
.stat { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 6px 0; font-size: 14px; }
.stat span { color: var(--dim); }
.stat small { color: var(--dim); font-weight: 400; }

#toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0; transition: .3s; pointer-events: none;
         background: var(--panel); border: 1px solid var(--gold); color: var(--gold); padding: 10px 18px; border-radius: 4px; font-size: 14px; z-index: 5; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 640px) {
  .settings { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr; }
  .rank { font-size: 90px; }
}
@media (prefers-reduced-motion: reduce) { .screen, .rank { animation: none; } }
a.home { position: fixed; top: 14px; left: 16px; color: var(--dim); text-decoration: none; font-size: 14px; letter-spacing: .08em; padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: rgba(10, 7, 26, .7); }
a.home:hover, a.home:focus-visible { color: var(--text); border-color: var(--cyan); outline: none; }
</style>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <div id="toast"></div>
</div>
